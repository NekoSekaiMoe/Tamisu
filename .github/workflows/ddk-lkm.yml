name: Build Tamisu Kernel Module

on:
  workflow_call:
    inputs:
      kmi:
        description: 'KMI version'
        required: true
        type: string
      ddk_release:
        description: 'DDK release version'
        required: false
        default: '20260313'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-tamisu-ko:
    name: Build tamisu.ko for ${{ inputs.kmi }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.kmi }}-${{ inputs.ddk_release }}
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v6

    - name: Build ko
      run: |
        git config --global --add safe.directory /__w/Tamisu/Tamisu
        cd core
        test -f include/uapi/supercall.h

        echo "=== Building tamisu.ko for KMI: ${{ inputs.kmi }} ==="
        CONFIG_TAMISU=m CC=clang make
        
        echo "=== Build completed ==="
        # Create output directory in GitHub workspace
        mkdir -p /github/workspace/out
        # Copy with KMI-specific naming
        OUTPUT_NAME="${{ inputs.kmi }}_tamisu.ko"
        cp *.ko "/github/workspace/out/$OUTPUT_NAME"
        
        echo "Copied to: /github/workspace/out/$OUTPUT_NAME"
        ls -la "/github/workspace/out/$OUTPUT_NAME"
        echo "Size: $(du -h "/github/workspace/out/$OUTPUT_NAME" | cut -f1)"
        llvm-strip -d "/github/workspace/out/$OUTPUT_NAME"
        echo "Size after stripping: $(du -h "/github/workspace/out/$OUTPUT_NAME" | cut -f1)"
        
    - name: Upload tamisu.ko artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.kmi }}-lkm
        path: |
          /github/workspace/out/*.ko
